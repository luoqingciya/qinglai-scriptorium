[package]
name = "qinglai-scriptorium"
version = "0.1.0"
description = "清籁斋 · 面向长篇小说与笔记的个人写作工作台"
authors = ["luoqingci"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qinglai_scriptorium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
thiserror = "1"
docx-rs = "0.4.22"
pulldown-cmark = "0.13.6"
sha2 = "0.10"
zip = "8"

[dev-dependencies]
tempfile = "3"

# 不设 profile.dev.package."*".opt-level。
# 本应用的 Rust 侧只做文件读写、Markdown 拆分与字数统计，计算量极小，
# 优化依赖换不来可感知的运行时收益，却让冷编译（尤其 CI）慢三倍以上。
