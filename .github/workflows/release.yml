name: Release

# 打 tag 触发正式发布；手动触发只构建并上传 artifact，用于验证流程本身。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # 创建 Release 需要写权限
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    # 目标平台只有 Windows。Tauri 在 Linux runner 上需要额外的系统库，
    # 直接用 windows runner 既贴近真实环境，也省去安装依赖的步骤。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # release profile 的产物与 CI 的 debug 产物不同，用独立 key 避免互相挤掉缓存
      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 版本号散落在三处，任何一处不一致都会让安装包名与 tag 对不上。
      # 发布前先拦住，比事后发现「下载下来的包版本号是旧的」便宜得多。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')

          echo "tag=$tag  tauri.conf=$conf  package.json=$pkg  Cargo.toml=$cargo_v"

          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag 与 tauri.conf.json 的 $conf 不一致"
            exit 1
          fi
          if [ "$conf" != "$pkg" ]; then
            echo "::error::tauri.conf.json($conf) 与 package.json($pkg) 不一致"
            exit 1
          fi
          if [ "$conf" != "$cargo_v" ]; then
            echo "::error::tauri.conf.json($conf) 与 Cargo.toml($cargo_v) 不一致"
            exit 1
          fi

      # 这一步会先跑 beforeBuildCommand（pnpm build = tsc + vite build），
      # 再做 release 编译与 NSIS 打包。类型检查因此也在发布链路上。
      - name: 构建安装包
        run: pnpm tauri build

      - name: 检查产物
        shell: bash
        run: |
          set -euo pipefail
          ls -lh src-tauri/target/release/bundle/nsis/
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有生成安装包"
            exit 1
          fi
          # 防呆：正常产物约 2.7MB，明显偏小说明打包中途出过问题
          size=$(node -p "require('fs').statSync('${files[0]}').size")
          echo "产物大小：$size 字节"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::安装包只有 $size 字节，明显不完整"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # 只有 tag 触发才发布。手动触发停在上面一步，先确认产物再决定要不要打 tag。
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
